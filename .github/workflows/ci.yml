name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (typecheck, lint, format, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mail-bridge
      - run: npm run validate

  smoke:
    name: smoke (docker compose single node)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KODY_PORT: 8080
      KODY_PUBLIC_URL: http://localhost:8080
      # CI-only values for a throwaway container on the runner's loopback.
      KODY_ADMIN_TOKEN: ci-admin-token-${{ github.run_id }}
      KODY_MASTER_KEY: ci-master-key-${{ github.run_id }}-${{ github.run_attempt }}
      # The secrets scenario's echo server runs on the runner; the container
      # reaches it over http as host.docker.internal.
      KODY_ALLOW_INSECURE_SECRET_HOSTS: host.docker.internal
      # Email / browser smoke defaults (not in wrangler.jsonc — single-node would
      # inherit them). The fake mail bridge runs on the runner.
      KODY_EMAIL_DOMAIN: kody.local.test
      KODY_EMAIL_INBOUND_TOKEN: ci-email-inbound-token-${{ github.run_id }}
      KODY_EMAIL_OUTBOUND_PROVIDER: bridge
      KODY_EMAIL_OUTBOUND_TOKEN: ci-email-bridge-token-${{ github.run_id }}
      KODY_EMAIL_OUTBOUND_URL: http://host.docker.internal:9796
      KODY_BROWSER_ALLOW_PRIVATE_HOSTS: 127.0.0.1,localhost,host.docker.internal
      # Defaults plus host.docker.internal so web smoke can preview a local JSON
      # file-map (private by name; must be listed exactly — see packages.md).
      KODY_PACKAGE_SOURCE_HOSTS: github.com,api.github.com,codeload.github.com,raw.githubusercontent.com,gist.githubusercontent.com,objects.githubusercontent.com,kody.codes,host.docker.internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$KODY_PUBLIC_URL/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs kody
          exit 1
      - name: Smoke
        run: KODY_URL=$KODY_PUBLIC_URL SMOKE_ECHO_HOST=host.docker.internal npm run smoke:cron
      - name: Container logs
        if: failure()
        run: docker compose logs kody
      - name: Stop
        if: always()
        run: docker compose down -v
