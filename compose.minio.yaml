# Overlay for compose.fleet.yaml: a bundled MinIO bucket so the fleet needs no
# cloud account. Enabled by COMPOSE_FILE in .env.example. The MinIO console is
# not published; reach it with `docker compose port minio 9001` if you need it.
services:
  minio:
    image: quay.io/minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    command: ['server', '/data', '--console-address', ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30

  deploy:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      KODY_CREATE_BUCKET: ${KODY_CREATE_BUCKET:-1}
    depends_on:
      minio:
        condition: service_healthy

  node-a:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      minio:
        condition: service_healthy

  node-b:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
